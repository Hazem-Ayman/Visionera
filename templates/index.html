<style>
        body {
            background-color: theme('colors.background');
        }
        /* Soft Brutalism Button Hover */
        .btn-brutal {
            border: 4px solid theme('colors.on-surface');
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
        }
        .btn-brutal:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px theme('colors.on-surface');
        }
        
        @keyframes float-margin {
            0%, 100% { margin-top: 0px; }
            50% { margin-top: -30px; }
        }
        .float-1 { animation: float-margin 6s ease-in-out infinite; }
        .float-2 { animation: float-margin 8s ease-in-out infinite 2s; }
        .float-3 { animation: float-margin 7s ease-in-out infinite 1s; }
        .float-4 { animation: float-margin 9s ease-in-out infinite 3s; }

        /* ── Modal overlay ─────────────────────────────── */
        #upload-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        #upload-modal.open { display: flex; }
        #upload-modal .modal-box {
            background: #fff;
            border: 4px solid #1c1b1b;
            border-radius: 1.5rem;
            box-shadow: 12px 12px 0px #1c1b1b;
            padding: 2rem 2.5rem;
            max-width: 420px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: pop-in 0.2s ease;
        }
        @keyframes pop-in {
            from { transform: scale(0.85); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }
        .modal-mode-btn {
            padding: 0.75rem 1.5rem;
            border: 3px solid #1c1b1b;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 4px 4px 0 #1c1b1b;
        }
        .modal-mode-btn:hover {
            transform: translate(-3px,-3px);
            box-shadow: 7px 7px 0 #1c1b1b;
        }
        .modal-mode-btn.detect  { background:#003ec7; color:#fff; }
        .modal-mode-btn.identify{ background:#e9c400; color:#221b00; }
        
        /* ── Photo result panel ─────────────────────────── */

            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;

            flex-direction: column;
            align-items: center;
            gap: 1rem;

            border: 3px solid #1c1b1b;

<script>
    // ── Mode switcher (webcam) ──────────────────────────────────
    function setMode(mode) {
        fetch('/set_mode', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode })
        })
        .then(r => r.json())
        .then(d => console.log('Webcam mode →', d.mode))
        .catch(e => console.error(e));
    }

    // ── Interactive Eyes ────────────────────────────────────────
    document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.eye').forEach(eye => {
            const rect = eye.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top  + rect.height / 2;
            const angle    = Math.atan2(e.clientY - cy, e.clientX - cx);
            const distance = Math.min(rect.width / 4, Math.hypot(e.clientX - cx, e.clientY - cy) / 6);
            const pupil    = eye.querySelector('.pupil');
            pupil.style.transform = `translate(${Math.cos(angle)*distance}px, ${Math.sin(angle)*distance}px)`;
        });
    });

    // ── Fullscreen ──────────────────────────────────────────────
    function toggleFullscreen() {
        const v = document.getElementById('video_feed_img');
        (v.requestFullscreen || v.webkitRequestFullscreen || v.msRequestFullscreen).call(v);
    }

    // ── Reset webcam feed ───────────────────────────────────────
    function resetFeed() {
        document.getElementById('hello-heading').innerText = 'Hello.';
        setMode('raw');
    }

    // ═══════════════════════════════════════════════════════════
    //  Upload flow
    // ═══════════════════════════════════════════════════════════
    let _uploadType = null;   // 'photo' | 'video'
    let _uploadMode = null;   // 'detection' | 'identification'

    /** Called when user clicks "Process Photo" button — shows mode picker then opens image picker */
    function startPhotoUpload() {
        _uploadType = 'photo';
        document.getElementById('modal-subtitle').textContent = 'What should be done with your photo?';
        document.getElementById('upload-modal').classList.add('open');
    }

    /** Called when user clicks "Process Video" button — shows mode picker then opens video picker */
    function startVideoUpload() {
        _uploadType = 'video';
        document.getElementById('modal-subtitle').textContent = 'What should be done with your video?';
        document.getElementById('upload-modal').classList.add('open');
    }

    function closeUploadModal() {
        document.getElementById('upload-modal').classList.remove('open');
        _uploadType = null;
    }

    /** User picks Detection or Identification from modal — then the correct file picker opens */
    function confirmUpload(mode) {
        _uploadMode = mode;
        const type = _uploadType;   // capture BEFORE closeUploadModal() nullifies it
        closeUploadModal();
        if (type === 'photo') {
            // Reset so the same file can be re-selected
            const inp = document.getElementById('photo-input');
            inp.value = '';
            inp.click();
        } else if (type === 'video') {
            const inp = document.getElementById('video-input');
            inp.value = '';
            inp.click();
        }
    }

    // ── Photo handling ──────────────────────────────────────────
    function handlePhotoSelected(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fd = new FormData();
        fd.append('photo', file);
        fd.append('mode', _uploadMode);

        fetch('/process_photo', { method: 'POST', body: fd })
            .then(r => {
                if (!r.ok) throw new Error('Server error ' + r.status);
                return r.blob();
            })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const img = document.getElementById('photo-result-img');
                img.src = url;
                document.getElementById('photo-result').classList.add('open');
            })
            .catch(e => alert('Photo processing failed: ' + e.message));
    }

    function closePhotoResult() {
        const panel = document.getElementById('photo-result');
        panel.classList.remove('open');
        const img = document.getElementById('photo-result-img');
        URL.revokeObjectURL(img.src);
        img.src = '';
    }

    // ── Video handling ──────────────────────────────────────────
    function handleVideoSelected(event) {
        const file = event.target.files[0];
        if (!file) return;
        event.target.value = '';

        const fd = new FormData();
        fd.append('video', file);
        fd.append('mode', _uploadMode);

        fetch('/upload_video', { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                if (data.error) throw new Error(data.error);
                // Point the video result <img> at the MJPEG stream
                const streamImg = document.getElementById('video-result-img');
                streamImg.src = data.stream_url;
                document.getElementById('video-result').classList.add('open');
            })
            .catch(e => alert('Video processing failed: ' + e.message));
    }

    function closeVideoResult() {
        const panel = document.getElementById('video-result');
        panel.classList.remove('open');
        const img = document.getElementById('video-result-img');
        img.src = '';   // stops the MJPEG stream immediately
    }

    // Close modals on backdrop click
    document.getElementById('upload-modal').addEventListener('click', function(e) {
        if (e.target === this) closeUploadModal();
    });
    document.getElementById('photo-result').addEventListener('click', function(e) {
        if (e.target === this) closePhotoResult();
    });
    document.getElementById('video-result').addEventListener('click', function(e) {
        if (e.target === this) closeVideoResult();
    });
    document.getElementById('add-person-modal').addEventListener('click', function(e) {
        if (e.target === this) closeAddPersonModal();
    });

    // ── Add Person Flow ─────────────────────────────────────────
    function openAddPersonModal() {
        document.getElementById('add-person-modal').style.display = 'flex';
    }

    function closeAddPersonModal() {
        document.getElementById('add-person-modal').style.display = 'none';
        document.getElementById('add-person-form').reset();
    }

    function submitAddPerson(event) {
        event.preventDefault();
        
        const name = document.getElementById('person-name').value;
        const files = document.getElementById('person-photos').files;
        
        if (!name || files.length === 0) return;
        
        const btn = document.getElementById('submit-add-person-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '⏳ Processing...';
        btn.disabled = true;
        
        const fd = new FormData();
        fd.append('name', name);
        for (let i = 0; i < files.length; i++) {
            fd.append('photos', files[i]);
        }
        
        fetch('/add_person', { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                if (data.error) throw new Error(data.error);
                alert('Success: ' + data.message);
                closeAddPersonModal();
            })
            .catch(e => alert('Failed to add person: ' + e.message))
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
    }
</script>
</body></html>
